name: FlakeXplain CANNIER conan
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Strict baseline only, or baseline followed by 25 rounds
        required: true
        default: full
        type: choice
        options: [baseline-only, full]
permissions:
  contents: read
concurrency:
  group: cannier-conan-${{ github.ref }}
  cancel-in-progress: false
jobs:
  subject:
    uses: ./.github/workflows/cannier-remaining-subject.yml
    with:
      subject: conan
      mode: ${{ inputs.mode }}
