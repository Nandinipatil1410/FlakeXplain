name: FlakeXplain Rich detection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flakexplain-rich-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Rich (Ubuntu, Python 3.11.9)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out FlakeXplain
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: scripts/setup_repos.py

      - name: Verify pipeline
        run: python -m unittest discover -s tests -v

      - name: Run baseline and 25 serial rounds
        timeout-minutes: 330
        env:
          FLAKEXPLAIN_WORK: ${{ runner.temp }}/flakexplain
        run: python run_all.py rich --work-dir "$FLAKEXPLAIN_WORK"

      - name: Upload evidence and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flakexplain-rich-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/flakexplain/repos/rich/results/
            ${{ runner.temp }}/flakexplain/repos/rich/logs/
            ${{ runner.temp }}/flakexplain/repos/rich/env_snapshot.txt
            ${{ runner.temp }}/flakexplain/repos/rich/environment.json
            ${{ runner.temp }}/flakexplain/repos/rich/setup_state.json
            ${{ runner.temp }}/flakexplain/repos/rich/baseline_state.json
            ${{ runner.temp }}/flakexplain/repos/rich/setup_log.md
            FlakeXplain_Flaky_Report.md