name: CANNIER historical subject executor
on:
  workflow_call:
    inputs:
      subject:
        required: true
        type: string
      mode:
        required: true
        type: string
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      SUBJECT: ${{ inputs.subject }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install historical system prerequisites
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git build-essential cmake default-jdk pkg-config \
            python3.8 python3.8-dev python3.8-venv python3.8-tk \
            libcurl4-openssl-dev libfreetype6-dev libfribidi-dev libharfbuzz-dev \
            libjpeg-dev libkrb5-dev liblapack-dev liblcms2-dev libldap2-dev \
            default-libmysqlclient-dev libopenblas-dev libopenjp2-7-dev libpq-dev \
            libsasl2-dev libsecp256k1-dev libsndfile1-dev libssl-dev libtiff-dev \
            libwebp-dev libxcb1-dev libgit2-dev tcl8.6-dev tk8.6-dev unixodbc-dev \
            zlib1g-dev ghostscript fonts-dejavu-core locales
          locale-gen en_US.UTF-8
      - name: Check out FlakeXplain
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        id: pipeline-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.8.18"
      - name: Verify pipeline and subject selection
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python -m pip install tomli==2.0.1
          python -c 'import json,os; c=json.load(open("cannier-replication/remaining-configs.json")); assert os.environ["SUBJECT"] in c; assert os.environ["MODE"] in ("baseline-only","full")'
          python -m unittest discover -s tests -v
      - name: Prepare unprivileged experiment user
        env:
          FLAKEXPLAIN_WORK: ${{ runner.temp }}/flakexplain
        run: |
          id cannier >/dev/null 2>&1 || useradd --create-home --shell /bin/bash cannier
          test -n "$GITHUB_WORKSPACE" && test "$GITHUB_WORKSPACE" != /
          test -n "$FLAKEXPLAIN_WORK" && test "$FLAKEXPLAIN_WORK" != /
          mkdir -p "$FLAKEXPLAIN_WORK"
          chown -R cannier:cannier "$GITHUB_WORKSPACE" "$FLAKEXPLAIN_WORK"
          runuser -u cannier -- id
      - name: Prepare Pillow image viewer and virtual display
        if: inputs.subject == 'pillow'
        run: |
          # The pinned ImageShow test requires a real supported Unix viewer.
          apt-get install -y imagemagick xvfb x11-utils
          runuser -u cannier -- display -version
          runuser -u cannier -- Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp > "$RUNNER_TEMP/pillow-xvfb.log" 2>&1 &
          ready=0
          for attempt in {1..20}; do
            if runuser -u cannier -- env DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != 1 ]; then
            cat "$RUNNER_TEMP/pillow-xvfb.log"
            exit 1
          fi
      - name: Verify Dask permission-test environment
        if: inputs.subject == 'dask'
        env:
          FLAKEXPLAIN_WORK: ${{ runner.temp }}/flakexplain
        run: |
          runuser -u cannier -- env HOME=/home/cannier USER=cannier LOGNAME=cannier python - "$FLAKEXPLAIN_WORK" <<'PY'
          import os
          import pathlib
          import stat
          import sys
          import tempfile

          if os.geteuid() == 0:
              raise SystemExit("Dask permission tests require an unprivileged user")
          with tempfile.TemporaryDirectory(dir=sys.argv[1]) as folder:
              directory = pathlib.Path(folder)
              sample = directory / "sample.yaml"
              sample.write_text("x: 1\n")
              for path in (directory, sample):
                  original = stat.S_IMODE(path.stat().st_mode)
                  try:
                      # Match the pinned Dask test's owner-read-bit toggle.
                      path.chmod(original ^ stat.S_IREAD)
                      try:
                          if path.is_dir():
                              os.listdir(path)
                          else:
                              path.read_text()
                      except PermissionError:
                          pass
                      else:
                          raise SystemExit("Read permissions are bypassed: " + str(path))
                  finally:
                      path.chmod(original)
          print("Verified unprivileged directory and file permission enforcement")
          PY
      - name: Prepare localhost SSH and SFTP for historical Airflow tests
        if: inputs.subject == 'airflow'
        run: |
          apt-get install -y openssh-server openssh-client
          install -d -m 0755 /run/sshd
          install -d -m 0700 -o cannier -g cannier /home/cannier/.ssh
          # The pinned tests explicitly set sftp_default.login to root.
          # Give only this disposable job's experiment user a root test key.
          runuser -u cannier -- ssh-keygen -t rsa -b 2048 -m PEM -N '' -f /home/cannier/.ssh/id_rsa
          # ssh_default has no login; SSHHook falls back to getpass.getuser().
          install -m 0600 -o cannier -g cannier /home/cannier/.ssh/id_rsa.pub /home/cannier/.ssh/authorized_keys
          install -d -m 0700 /root/.ssh
          install -m 0600 /home/cannier/.ssh/id_rsa.pub /root/.ssh/authorized_keys
          ssh-keygen -A
          cat > /etc/ssh/sshd_config_flakexplain <<'EOF'
          Port 22
          ListenAddress 127.0.0.1
          ListenAddress ::1
          HostKey /etc/ssh/ssh_host_rsa_key
          PermitRootLogin prohibit-password
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM yes
          AuthorizedKeysFile .ssh/authorized_keys
          Subsystem sftp internal-sftp
          PidFile /run/sshd-flakexplain.pid
          EOF
          /usr/sbin/sshd -t -f /etc/ssh/sshd_config_flakexplain
          /usr/sbin/sshd -f /etc/ssh/sshd_config_flakexplain
          awk '{print "localhost,127.0.0.1,::1 " $1 " " $2}' /etc/ssh/ssh_host_rsa_key.pub > /home/cannier/.ssh/known_hosts
          chown cannier:cannier /home/cannier/.ssh/known_hosts
          chmod 0600 /home/cannier/.ssh/known_hosts
          runuser -u cannier -- ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@localhost true
          runuser -u cannier -- ssh -o BatchMode=yes -o StrictHostKeyChecking=yes cannier@localhost true
          printf 'pwd\nquit\n' | runuser -u cannier -- sftp -b - root@localhost
      - name: Prepare Salt terminal login service
        if: inputs.subject == 'salt'
        run: |
          apt-get install -y openssh-server openssh-client
          install -d -m 0755 /run/sshd
          # Minimal containers may omit the login accounting file.
          touch /run/utmp
          chmod 0664 /run/utmp
          install -d -m 0700 -o cannier -g cannier /home/cannier/.ssh
          runuser -u cannier -- ssh-keygen -t rsa -b 2048 -N '' -f /home/cannier/.ssh/salt_ci
          install -m 0600 -o cannier -g cannier /home/cannier/.ssh/salt_ci.pub /home/cannier/.ssh/authorized_keys
          ssh-keygen -A
          cat > /etc/ssh/sshd_config_salt <<'EOF'
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/ssh_host_rsa_key
          PermitRootLogin no
          AllowUsers cannier
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM yes
          PermitTTY yes
          AllowTcpForwarding no
          X11Forwarding no
          AuthorizedKeysFile .ssh/authorized_keys
          PidFile /run/sshd-salt.pid
          EOF
          /usr/sbin/sshd -t -f /etc/ssh/sshd_config_salt
          /usr/sbin/sshd -f /etc/ssh/sshd_config_salt
          awk '{print "[127.0.0.1]:2222 " $1 " " $2}' /etc/ssh/ssh_host_rsa_key.pub > /home/cannier/.ssh/salt_known_hosts
          chmod 0600 /home/cannier/.ssh/salt_known_hosts
      - name: Prepare historical Conan CMake tool locations
        if: inputs.subject == 'conan'
        run: |
          # The editable CMake layout tests explicitly use the Ninja generator.
          apt-get install -y ninja-build
          runuser -u cannier -- ninja --version
          # These exact paths are selected by conans/test/conftest.py.
          for version in 3.15.7 3.16.9 3.17.5 3.19.7; do
            archive="cmake-${version}-Linux-x86_64.tar.gz"
            download_dir=$(mktemp -d)
            curl --fail --location --retry 3 "https://github.com/Kitware/CMake/releases/download/v${version}/${archive}" -o "$download_dir/$archive"
            curl --fail --location --retry 3 "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-SHA-256.txt" -o "$download_dir/checksums.txt"
            (cd "$download_dir" && sha256sum --check --ignore-missing checksums.txt)
            tar -xzf "$download_dir/$archive" -C /usr/share
            ln -s "/usr/share/cmake-${version}-Linux-x86_64" "/usr/share/cmake-${version}"
            runuser -u cannier -- "/usr/share/cmake-${version}/bin/cmake" --version
          done
      - name: Run strict baseline gate
        if: inputs.mode == 'baseline-only'
        timeout-minutes: 300
        env:
          FLAKEXPLAIN_PYTHON: ${{ steps.pipeline-python.outputs.python-path }}
          FLAKEXPLAIN_WORK: ${{ runner.temp }}/flakexplain
        run: bash scripts/run_cannier_subject.sh baseline-only
      - name: Run baseline and 25 detection rounds
        if: inputs.mode == 'full'
        timeout-minutes: 300
        env:
          FLAKEXPLAIN_PYTHON: ${{ steps.pipeline-python.outputs.python-path }}
          FLAKEXPLAIN_WORK: ${{ runner.temp }}/flakexplain
        run: bash scripts/run_cannier_subject.sh full
      - name: Package evidence without source or executable files
        if: always()
        env:
          FLAKEXPLAIN_WORK: ${{ runner.temp }}/flakexplain
          MODE: ${{ inputs.mode }}
        run: |
          python scripts/package_cannier_evidence.py --subject "$SUBJECT" --work-dir "$FLAKEXPLAIN_WORK" --output evidence
      - name: Upload raw evidence even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cannier-${{ inputs.subject }}-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: evidence/
