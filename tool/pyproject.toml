[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flakexplain"
version = "0.1.0"
description = "Detect flaky pytest tests by reordered reruns, and triage CI failures as likely flaky or likely real."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Nandini Patil" }, { name = "Bhumika Mane" },
  { name = "Trusha Kulkarni" }, { name = "Pranavi Baad" },
]
# The shipped model is a scikit-learn 1.7.2 pickle; other versions may fail to load it.
dependencies = ["scikit-learn==1.7.2", "numpy>=1.26", "joblib>=1.3", "pytest>=7"]

[project.optional-dependencies]
shap = ["shap>=0.46"]
test = ["pytest>=7"]

[project.scripts]
flakexplain = "flakexplain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flakexplain = ["data/*.joblib", "data/*.json"]
